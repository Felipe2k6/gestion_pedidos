{% extends 'base.html' %}
{% block content %}

<h2>Pedido #{{ pedido.id }}</h2>

<form method="POST">
    {% csrf_token %}

    <select name="producto" class="form-select">
    {% for p in productos %}
        <option value="{{ p.id }}" {% if p.stock == 0 %}disabled{% endif %}>
    {{ p.nombre }} (Stock: {{ p.stock }})
    </option>
    {% endfor %}
    </select>

    <input type="number" name="cantidad" class="form-control mb-2" placeholder="Cantidad">

    <button class="btn btn-primary">Agregar</button>
</form>

<h3 class="mt-4">Productos en el pedido</h3>

<table class="table">
<tr>
    <th>Producto</th>
    <th>Cantidad</th>
</tr>

{% for d in detalles %}
<tr>
    <td>{{ d.producto.nombre }}</td>
    <td>{{ d.cantidad }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
