{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h1>Editar Cliente</h1>

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ Cliente.nombre }}" required>
        </div>

        <div class="mb-3">
            <label>Teléfono</label>
            <input type="number" name="telefono" class="form-control" value="{{ Cliente.precio }}" required>
        </div>

        <button type="submit" class="btn btn-warning">Actualizar</button>
    </form>

    <a href="/clientes/" class="btn btn-secondary mt-3">Volver</a>

</div>
{% endblock %}
