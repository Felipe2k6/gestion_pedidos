<!DOCTYPE html>
<html>
<head>
    <title>Gestión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<div class="d-flex">

    <!-- SIDEBAR -->
    <div style="width:250px; background:#1e293b; min-height:100vh;" class="text-white p-3">

        <h4 class="mb-4">Gestión</h4>

        <a href="/dashboard/" class="d-block text-white mb-2">📊 Dashboard</a>

        {% if user.perfil.tipo_usuario == 'admin' %}
        <a href="/clientes/" class="d-block text-white mb-2">👤 Clientes</a>
        <a href="/productos/" class="d-block text-white mb-2">📦 Productos</a>
        {% endif %}

        <a href="/pedidos/" class="d-block text-white mb-2">🧾 Pedidos</a>

        <hr>

        <a href="/logout/" class="text-danger">Cerrar sesión</a>

    </div>

    <!-- CONTENIDO -->
    <div class="flex-grow-1 p-4">

        <div class="d-flex justify-content-between mb-4">
            <h4>{% block title %}{% endblock %}</h4>
            <span>{{ user.username }}</span>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}

    </div>

</div>

</body>
</html>
